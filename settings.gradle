pluginManagement {
    repositories {
        maven {
            name = 'AliyunPlugin'
            url = 'https://maven.aliyun.com/repository/gradle-plugin'
        }
        gradlePluginPortal()
        maven {
            name = 'BMCLAPI'
            url = 'https://bmclapi2.bangbang93.com/maven/'
        }
        mavenCentral()
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.8.0'
}

rootProject.name = 'sciencepacks'
